name: Prototipo privado
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: survivor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run licenses
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: test-results/
          retention-days: 7
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: one-piece-survivor-browser
          path: release/one-piece-survivor-browser-*.zip
          retention-days: 14
